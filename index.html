<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARGUS-RX | OSINT & Security Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #e6edf3;
            margin: 0;
        }

        header {
            border-bottom: 1px solid #30363d;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 3px;
        }

        header p {
            color: #8b949e;
            margin-bottom: 0;
        }

        main {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        input {
            flex: 1;
            padding: 14px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 14px 24px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin: 20px 0;
            color: #8b949e;
        }

        .result {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 25px;
            margin-top: 20px;
        }

        .result h2 {
            margin-top: 0;
        }

        .verdict-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .verdict {
            font-size: 26px;
            font-weight: bold;
        }

        .malicious {
            color: #ff7b72;
        }

        .clean {
            color: #3fb950;
        }

        .warning {
            color: #d29922;
        }

        .neutral {
            color: #8b949e;
        }

        .detection-count {
            color: #8b949e;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .item {
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            background: #0d1117;
        }

        .label {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
        }

        .value {
            margin-top: 6px;
            word-break: break-word;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
            font-size: 17px;
        }

        .report-box {
            position: relative;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }

        .report-box pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e6edf3;
        }

        .copy-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .copy-btn {
            padding: 9px 15px;
            background: #21262d;
            border: 1px solid #30363d;
            font-size: 13px;
        }

        .copy-btn:hover {
            background: #30363d;
        }

        .info-list {
            display: grid;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #21262d;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #8b949e;
        }

        .info-value {
            text-align: right;
            word-break: break-word;
        }

        .empty {
            color: #8b949e;
            font-style: italic;
        }

        footer {
            text-align: center;
            border-top: 1px solid #30363d;
            padding: 25px;
            color: #8b949e;
            margin-top: 80px;
        }

        @media (max-width: 650px) {
            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }

            .info-value {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ARGUS-RX</h1>
    <p>Open Source Intelligence & Security Visibility</p>
</header>

<main>

    <h2>IOC Intelligence</h2>

    <p>
        Analyze file hashes using VirusTotal threat intelligence.
    </p>

    <div class="search-box">

        <input
            id="hashInput"
            type="text"
            placeholder="Enter MD5, SHA-1, or SHA-256"
        >

        <button id="analyzeBtn" onclick="analyzeHash()">
            Analyze
        </button>

    </div>

    <div id="status"></div>

    <div id="results"></div>

</main>

<footer>
    <p>ARGUS-RX • Security Intelligence Platform</p>
</footer>

<script>

    // Cloudflare Worker
    const WORKER_URL = "https://argux-rxapi.sthing-ao.workers.dev";

    let currentReport = "";

    async function analyzeHash() {

        const input = document.getElementById("hashInput");
        const button = document.getElementById("analyzeBtn");
        const status = document.getElementById("status");
        const results = document.getElementById("results");

        const hash = input.value.trim();

        if (!hash) {
            status.textContent = "Please enter a file hash.";
            return;
        }

        if (
            !/^[a-fA-F0-9]{32}$|^[a-fA-F0-9]{40}$|^[a-fA-F0-9]{64}$/.test(hash)
        ) {
            status.textContent =
                "Invalid hash. Enter an MD5, SHA-1, or SHA-256 hash.";
            return;
        }

        button.disabled = true;
        status.textContent = "Querying VirusTotal...";
        results.innerHTML = "";

        try {

            const response = await fetch(
                `${WORKER_URL}/?hash=${encodeURIComponent(hash)}`
            );

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error?.message ||
                    data.error ||
                    "VirusTotal lookup failed."
                );

            }

            if (!data.data || !data.data.attributes) {
                throw new Error(
                    "Invalid response received from VirusTotal."
                );
            }

            const attributes = data.data.attributes;

            const stats = attributes.last_analysis_stats || {};

            const malicious = stats.malicious || 0;
            const suspicious = stats.suspicious || 0;
            const undetected = stats.undetected || 0;
            const timeout = stats.timeout || 0;
            const unsupported = stats["type-unsupported"] || 0;

            const totalEngines =
                malicious +
                suspicious +
                undetected +
                timeout +
                unsupported +
                (stats.harmless || 0) +
                (stats["confirmed-timeout"] || 0) +
                (stats.failure || 0);

            let verdict = "NO MALICIOUS DETECTIONS";
            let verdictClass = "clean";

            if (malicious > 0) {

                verdict = "MALICIOUS";
                verdictClass = "malicious";

            } else if (suspicious > 0) {

                verdict = "SUSPICIOUS";
                verdictClass = "warning";

            }

            const threatClassification =
                attributes.popular_threat_classification || {};

            const suggestedLabel =
                threatClassification.suggested_threat_label ||
                "None";

            const category =
                threatClassification.category ||
                "None";

            const signatureInfo =
                attributes.signature_info || {};

            const product =
                signatureInfo.product ||
                "Unknown";

            const version =
                signatureInfo.version ||
                signatureInfo.file_version ||
                "Unknown";

            const description =
                signatureInfo.description ||
                "Unknown";

            const meaningfulName =
                attributes.meaningful_name ||
                "Unknown";

            const fileType =
                attributes.type_description ||
                "Unknown";

            const size =
                formatBytes(attributes.size);

            const submissions =
                attributes.times_submitted || 0;

            /*
             * Build copyable analyst report
             */

            currentReport = buildAnalystReport({
                verdict,
                malicious,
                suspicious,
                undetected,
                totalEngines,
                meaningfulName,
                fileType,
                suggestedLabel,
                size,
                attributes,
                submissions,
                category,
                product,
                version
            });

            /*
             * Sandbox information
             */

            const sandboxVerdicts =
                attributes.sandbox_verdicts || {};

            let sandboxHTML = "";

            const sandboxEntries =
                Object.entries(sandboxVerdicts);

            if (sandboxEntries.length > 0) {

                sandboxHTML = sandboxEntries.map(
                    ([name, verdict]) => {

                        const sandboxVerdict =
                            verdict?.verdict || "Unknown";

                        const confidence =
                            verdict?.confidence !== undefined
                                ? `${verdict.confidence}% confidence`
                                : "";

                        return `
                            <div class="item">
                                <div class="label">
                                    ${escapeHTML(name)}
                                </div>

                                <div class="value">
                                    ${escapeHTML(sandboxVerdict)}
                                    ${confidence
                                        ? ` — ${escapeHTML(confidence)}`
                                        : ""}
                                </div>
                            </div>
                        `;
                    }
                ).join("");

            } else {

                sandboxHTML =
                    `<p class="empty">No sandbox verdict information available.</p>`;

            }

            /*
             * Render results
             */

            results.innerHTML = `

                <!-- COPYABLE REPORT -->

                <div class="result">

                    <div class="verdict-box">

                        <div>
                            <div class="label">
                                ARGUS-RX VERDICT
                            </div>

                            <div class="verdict ${verdictClass}">
                                ${verdict}
                            </div>
                        </div>

                        <div class="detection-count">
                            ${malicious} malicious /
                            ${suspicious} suspicious /
                            ${undetected} undetected
                        </div>

                    </div>

                    <h3 class="section-title">
                        Copyable Analyst Report
                    </h3>

                    <div class="copy-container">

                        <button
                            class="copy-btn"
                            onclick="copyReport()"
                        >
                            📋 Copy Report
                        </button>

                    </div>

                    <div class="report-box">

                        <pre id="analystReport">${escapeHTML(currentReport)}</pre>

                    </div>

                </div>


                <!-- FILE INFORMATION -->

                <div class="result">

                    <h3 class="section-title">
                        File Information
                    </h3>

                    <div class="grid">

                        <div class="item">
                            <div class="label">
                                File Name
                            </div>

                            <div class="value">
                                ${escapeHTML(meaningfulName)}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                File Type
                            </div>

                            <div class="value">
                                ${escapeHTML(fileType)}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                File Size
                            </div>

                            <div class="value">
                                ${size}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Times Submitted
                            </div>

                            <div class="value">
                                ${submissions}
                            </div>
                        </div>

                    </div>

                </div>


                <!-- HASHES -->

                <div class="result">

                    <h3 class="section-title">
                        Hashes
                    </h3>

                    <div class="info-list">

                        <div class="info-row">
                            <div class="info-label">
                                MD5
                            </div>

                            <div class="info-value">
                                ${escapeHTML(attributes.md5 || "Unknown")}
                            </div>
                        </div>

                        <div class="info-row">
                            <div class="info-label">
                                SHA-1
                            </div>

                            <div class="info-value">
                                ${escapeHTML(attributes.sha1 || "Unknown")}
                            </div>
                        </div>

                        <div class="info-row">
                            <div class="info-label">
                                SHA-256
                            </div>

                            <div class="info-value">
                                ${escapeHTML(attributes.sha256 || hash)}
                            </div>
                        </div>

                    </div>

                </div>


                <!-- DETECTION ANALYSIS -->

                <div class="result">

                    <h3 class="section-title">
                        Detection Analysis
                    </h3>

                    <div class="grid">

                        <div class="item">
                            <div class="label">
                                Malicious
                            </div>

                            <div class="value malicious">
                                ${malicious}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Suspicious
                            </div>

                            <div class="value warning">
                                ${suspicious}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Undetected
                            </div>

                            <div class="value">
                                ${undetected}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Timeout
                            </div>

                            <div class="value">
                                ${timeout}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Unsupported
                            </div>

                            <div class="value">
                                ${unsupported}
                            </div>
                        </div>

                    </div>

                </div>


                <!-- THREAT INTELLIGENCE -->

                <div class="result">

                    <h3 class="section-title">
                        Threat Intelligence
                    </h3>

                    <div class="grid">

                        <div class="item">
                            <div class="label">
                                Category
                            </div>

                            <div class="value">
                                ${escapeHTML(category)}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Suggested Threat
                            </div>

                            <div class="value">
                                ${escapeHTML(suggestedLabel)}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Product
                            </div>

                            <div class="value">
                                ${escapeHTML(product)}
                            </div>
                        </div>

                        <div class="item">
                            <div class="label">
                                Version
                            </div>

                            <div class="value">
                                ${escapeHTML(version)}
                            </div>
                        </div>

                    </div>

                </div>


                <!-- SANDBOX -->

                <div class="result">

                    <h3 class="section-title">
                        Sandbox Intelligence
                    </h3>

                    <div class="grid">

                        ${sandboxHTML}

                    </div>

                </div>

            `;

            status.textContent =
                "Analysis complete.";

        } catch (error) {

            console.error("ARGUS-RX error:", error);

            status.textContent =
                "Lookup failed.";

            results.innerHTML = `
                <div class="result">

                    <h3 class="malicious">
                        Error
                    </h3>

                    <p>
                        ${escapeHTML(error.message)}
                    </p>

                </div>
            `;

        } finally {

            button.disabled = false;

        }
    }


    /*
     * Build the SOC-friendly copyable report
     */

    function buildAnalystReport(data) {

        const md5 =
            data.attributes.md5 || "Unknown";

        const sha1 =
            data.attributes.sha1 || "Unknown";

        const sha256 =
            data.attributes.sha256 || "Unknown";

        return `ARGUS-RX — VIRUSTOTAL IOC REPORT
================================

VERDICT: ${data.verdict}
DETECTION: ${data.malicious} / ${data.totalEngines} engines

FILE
Name: ${data.meaningfulName}
Type: ${data.fileType}
Threat: ${data.suggestedLabel}
Size: ${data.size}

HASHES
MD5: ${md5}
SHA-1: ${sha1}
SHA-256: ${sha256}

VT SUBMISSIONS: ${data.submissions}
SOURCE: VirusTotal

----------------------
OTHER INTELLIGENCE
----------------------

THREAT CLASSIFICATION
Category: ${data.category}
Suggested Label: ${data.suggestedLabel}

FILE DETAILS
Product: ${data.product}
Version: ${data.version}

REPUTATION
Malicious: ${data.malicious}
Suspicious: ${data.suspicious}
Undetected: ${data.undetected}`;
    }


    /*
     * Copy report to clipboard
     */

    async function copyReport() {

        if (!currentReport) {
            return;
        }

        try {

            await navigator.clipboard.writeText(
                currentReport
            );

            const button =
                document.querySelector(".copy-btn");

            if (button) {

                const originalText =
                    button.textContent;

                button.textContent =
                    "✓ Copied";

                setTimeout(() => {

                    button.textContent =
                        originalText;

                }, 2000);

            }

        } catch (error) {

            console.error(
                "Copy failed:",
                error
            );

            alert(
                "Unable to copy the report."
            );

        }
    }


    /*
     * Format bytes
     */

    function formatBytes(bytes) {

        if (!bytes) {
            return "Unknown";
        }

        const units =
            ["B", "KB", "MB", "GB"];

        let i = 0;

        while (
            bytes >= 1024 &&
            i < units.length - 1
        ) {
            bytes /= 1024;
            i++;
        }

        return `${bytes.toFixed(2)} ${units[i]}`;
    }


    /*
     * Basic HTML escaping
     */

    function escapeHTML(value) {

        if (value === null ||
            value === undefined) {

            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

</script>

</body>
</html>
