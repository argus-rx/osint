<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARGUS-RX | OSINT & Security Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0f14;
            color: #e6edf3;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        header {
            border-bottom: 1px solid #30363d;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 3px;
        }

        header p {
            margin: 5px 0 0;
            color: #8b949e;
            font-size: 12px;
        }

        main {
            width: min(1100px, calc(100% - 30px));
            margin: 25px auto 50px;
        }

        h2 {
            margin: 0 0 5px;
            font-size: 18px;
        }

        .description {
            color: #8b949e;
            margin: 0 0 18px;
            font-size: 12px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: #e6edf3;
            font-family: Consolas, monospace;
            font-size: 12px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 9px 15px;
            background: #238636;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #status {
            min-height: 18px;
            margin: 8px 0;
            color: #8b949e;
            font-size: 11px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 7px;
            border-bottom: 1px solid #30363d;
        }

        .card-title h3 {
            margin: 0;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .verdict-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .verdict {
            font-size: 19px;
            font-weight: bold;
        }

        .malicious {
            color: #ff7b72;
        }

        .warning {
            color: #d29922;
        }

        .clean {
            color: #3fb950;
        }

        .neutral {
            color: #8b949e;
        }

        .detection {
            color: #8b949e;
            font-size: 11px;
        }

        .copy-btn {
            padding: 6px 10px;
            background: #21262d;
            font-size: 11px;
        }

        .copy-btn:hover {
            background: #30363d;
        }

        .report {
            margin: 0;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: Consolas, Monaco, monospace;
            font-size: 11px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
        }

        .item:last-child {
            border-bottom: none;
        }

        .label {
            color: #8b949e;
            font-size: 11px;
            white-space: nowrap;
        }

        .value {
            color: #e6edf3;
            text-align: right;
            font-size: 11px;
            word-break: break-word;
        }

        .hash-value {
            font-family: Consolas, Monaco, monospace;
            font-size: 10px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .empty {
            color: #8b949e;
            font-size: 11px;
            margin: 0;
        }

        footer {
            border-top: 1px solid #30363d;
            padding: 15px;
            text-align: center;
            color: #8b949e;
            font-size: 10px;
        }

        @media (max-width: 700px) {

            main {
                width: calc(100% - 20px);
                margin-top: 18px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .grid,
            .section-grid {
                grid-template-columns: 1fr;
            }

            .item {
                align-items: flex-start;
            }

            .value {
                text-align: right;
            }

            .verdict-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ARGUS-RX</h1>
    <p>Open Source Intelligence & Security Visibility</p>
</header>

<main>

    <h2>IOC Intelligence</h2>

    <p class="description">
        Analyze file hashes using VirusTotal threat intelligence.
    </p>

    <div class="search-box">

        <input
            id="hashInput"
            type="text"
            placeholder="Enter MD5, SHA-1, or SHA-256"
            autocomplete="off"
        >

        <button
            id="analyzeBtn"
            onclick="analyzeHash()"
        >
            Analyze
        </button>

    </div>

    <div id="status"></div>

    <div id="results"></div>

</main>

<footer>
    ARGUS-RX • Security Intelligence Platform
</footer>


<script>

    // Cloudflare Worker
    const WORKER_URL =
        "https://argux-rxapi.sthing-ao.workers.dev";

    let currentReport = "";


    async function analyzeHash() {

        const input =
            document.getElementById("hashInput");

        const button =
            document.getElementById("analyzeBtn");

        const status =
            document.getElementById("status");

        const results =
            document.getElementById("results");

        const hash =
            input.value.trim();


        if (!hash) {

            status.textContent =
                "Please enter a file hash.";

            return;
        }


        if (
            !/^[a-fA-F0-9]{32}$|^[a-fA-F0-9]{40}$|^[a-fA-F0-9]{64}$/
                .test(hash)
        ) {

            status.textContent =
                "Invalid hash. Enter an MD5, SHA-1, or SHA-256 hash.";

            return;
        }


        button.disabled = true;

        status.textContent =
            "Querying VirusTotal...";

        results.innerHTML = "";


        try {

            const response = await fetch(
                `${WORKER_URL}/?hash=${encodeURIComponent(hash)}`
            );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error?.message ||
                    data.error ||
                    "VirusTotal lookup failed."
                );

            }


            if (
                !data.data ||
                !data.data.attributes
            ) {

                throw new Error(
                    "Invalid response received from VirusTotal."
                );

            }


            const attributes =
                data.data.attributes;


            const stats =
                attributes.last_analysis_stats || {};


            const malicious =
                stats.malicious || 0;

            const suspicious =
                stats.suspicious || 0;

            const undetected =
                stats.undetected || 0;

            const harmless =
                stats.harmless || 0;

            const timeout =
                stats.timeout || 0;

            const unsupported =
                stats["type-unsupported"] || 0;

            const confirmedTimeout =
                stats["confirmed-timeout"] || 0;

            const failure =
                stats.failure || 0;


            const totalEngines =
                malicious +
                suspicious +
                undetected +
                harmless +
                timeout +
                unsupported +
                confirmedTimeout +
                failure;


            let verdict =
                "NO MALICIOUS DETECTIONS";

            let verdictClass =
                "clean";


            if (malicious > 0) {

                verdict =
                    "MALICIOUS";

                verdictClass =
                    "malicious";

            } else if (suspicious > 0) {

                verdict =
                    "SUSPICIOUS";

                verdictClass =
                    "warning";

            }


            const classification =
                attributes.popular_threat_classification || {};


            const threat =
                classification.suggested_threat_label ||
                "None";


            const category =
                classification.category ||
                "None";


            const signature =
                attributes.signature_info || {};


            const product =
                signature.product ||
                "Unknown";


            const version =
                signature.version ||
                signature.file_version ||
                "Unknown";


            const meaningfulName =
                attributes.meaningful_name ||
                "Unknown";


            const fileType =
                attributes.type_description ||
                "Unknown";


            const fileSize =
                formatBytes(attributes.size);


            const submissions =
                attributes.times_submitted ||
                0;


            currentReport =
                buildAnalystReport({

                    verdict,
                    malicious,
                    suspicious,
                    undetected,
                    totalEngines,

                    meaningfulName,
                    fileType,
                    threat,
                    fileSize,

                    attributes,
                    submissions,

                    category,
                    product,
                    version

                });


            renderResults({

                verdict,
                verdictClass,

                malicious,
                suspicious,
                undetected,
                harmless,
                timeout,
                unsupported,

                totalEngines,

                meaningfulName,
                fileType,
                fileSize,

                threat,
                category,

                product,
                version,

                submissions,

                attributes

            });


            status.textContent =
                "Analysis complete.";


        } catch (error) {

            console.error(
                "ARGUS-RX error:",
                error
            );


            status.textContent =
                "Lookup failed.";


            results.innerHTML = `

                <div class="card">

                    <div class="card-title">
                        <h3>Error</h3>
                    </div>

                    <p class="malicious">
                        ${escapeHTML(error.message)}
                    </p>

                </div>

            `;

        } finally {

            button.disabled = false;

        }

    }


    function renderResults(data) {

        const results =
            document.getElementById("results");


        const sandboxHTML =
            buildSandboxHTML(
                data.attributes.sandbox_verdicts
            );


        results.innerHTML = `

            <!-- COPYABLE REPORT -->

            <div class="card">

                <div class="verdict-row">

                    <div>

                        <div class="label">
                            ARGUS-RX VERDICT
                        </div>

                        <div class="verdict ${data.verdictClass}">
                            ${data.verdict}
                        </div>

                    </div>

                    <div class="detection">
                        Detection:
                        ${data.malicious} malicious /
                        ${data.suspicious} suspicious /
                        ${data.undetected} undetected
                    </div>

                </div>


                <div class="card-title">

                    <h3>
                        Copyable Analyst Report
                    </h3>

                    <button
                        class="copy-btn"
                        onclick="copyReport()"
                    >
                        Copy Report
                    </button>

                </div>


                <pre class="report" id="analystReport">${escapeHTML(currentReport)}</pre>

            </div>


            <!-- FILE -->

            <div class="card">

                <div class="card-title">
                    <h3>File Information</h3>
                </div>

                <div class="grid">

                    ${infoItem(
                        "Name",
                        data.meaningfulName
                    )}

                    ${infoItem(
                        "Type",
                        data.fileType
                    )}

                    ${infoItem(
                        "Size",
                        data.fileSize
                    )}

                    ${infoItem(
                        "VT Submissions",
                        data.submissions
                    )}

                </div>

            </div>


            <!-- HASHES -->

            <div class="card">

                <div class="card-title">
                    <h3>Hashes</h3>
                </div>

                <div class="grid">

                    ${hashItem(
                        "MD5",
                        data.attributes.md5
                    )}

                    ${hashItem(
                        "SHA-1",
                        data.attributes.sha1
                    )}

                    ${hashItem(
                        "SHA-256",
                        data.attributes.sha256
                    )}

                </div>

            </div>


            <!-- DETECTION -->

            <div class="card">

                <div class="card-title">
                    <h3>Detection Analysis</h3>
                </div>

                <div class="grid">

                    ${infoItem(
                        "Malicious",
                        data.malicious,
                        "malicious"
                    )}

                    ${infoItem(
                        "Suspicious",
                        data.suspicious,
                        "warning"
                    )}

                    ${infoItem(
                        "Undetected",
                        data.undetected
                    )}

                    ${infoItem(
                        "Harmless",
                        data.harmless
                    )}

                    ${infoItem(
                        "Timeout",
                        data.timeout
                    )}

                    ${infoItem(
                        "Unsupported",
                        data.unsupported
                    )}

                </div>

            </div>


            <!-- THREAT INTELLIGENCE -->

            <div class="card">

                <div class="card-title">
                    <h3>Threat Intelligence</h3>
                </div>

                <div class="grid">

                    ${infoItem(
                        "Category",
                        data.category
                    )}

                    ${infoItem(
                        "Threat",
                        data.threat
                    )}

                    ${infoItem(
                        "Product",
                        data.product
                    )}

                    ${infoItem(
                        "Version",
                        data.version
                    )}

                </div>

            </div>


            <!-- SANDBOX -->

            <div class="card">

                <div class="card-title">
                    <h3>Sandbox Intelligence</h3>
                </div>

                <div class="section-grid">

                    ${sandboxHTML}

                </div>

            </div>

        `;
    }


    function buildAnalystReport(data) {

        return `ARGUS-RX — VIRUSTOTAL IOC REPORT
================================

VERDICT: ${data.verdict}
DETECTION: ${data.malicious} / ${data.totalEngines} engines

FILE
Name: ${data.meaningfulName}
Type: ${data.fileType}
Threat: ${data.threat}
Size: ${data.fileSize}

HASHES
MD5: ${data.attributes.md5 || "Unknown"}
SHA-1: ${data.attributes.sha1 || "Unknown"}
SHA-256: ${data.attributes.sha256 || "Unknown"}

VT SUBMISSIONS: ${data.submissions}
SOURCE: VirusTotal

----------------------
OTHER INTELLIGENCE
----------------------

THREAT CLASSIFICATION
Category: ${data.category}
Suggested Label: ${data.threat}

FILE DETAILS
Product: ${data.product}
Version: ${data.version}

REPUTATION
Malicious: ${data.malicious}
Suspicious: ${data.suspicious}
Undetected: ${data.undetected}`;
    }


    async function copyReport() {

        if (!currentReport) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                currentReport
            );


            const button =
                document.querySelector(".copy-btn");


            if (button) {

                const original =
                    button.textContent;

                button.textContent =
                    "Copied";

                setTimeout(() => {

                    button.textContent =
                        original;

                }, 1500);

            }

        } catch (error) {

            console.error(
                "Copy failed:",
                error
            );

        }

    }


    function infoItem(
        label,
        value,
        className = ""
    ) {

        return `

            <div class="item">

                <span class="label">
                    ${escapeHTML(label)}
                </span>

                <span class="value ${className}">
                    ${escapeHTML(
                        value ?? "Unknown"
                    )}
                </span>

            </div>

        `;
    }


    function hashItem(
        label,
        value
    ) {

        return `

            <div class="item">

                <span class="label">
                    ${escapeHTML(label)}
                </span>

                <span class="value hash-value">
                    ${escapeHTML(
                        value || "Unknown"
                    )}
                </span>

            </div>

        `;
    }


    function buildSandboxHTML(
        sandboxVerdicts
    ) {

        if (!sandboxVerdicts) {

            return `
                <p class="empty">
                    No sandbox verdict information available.
                </p>
            `;

        }


        const entries =
            Object.entries(
                sandboxVerdicts
            );


        if (!entries.length) {

            return `
                <p class="empty">
                    No sandbox verdict information available.
                </p>
            `;

        }


        return entries.map(
            ([name, data]) => {

                const verdict =
                    data?.verdict ||
                    "Unknown";

                const confidence =
                    data?.confidence !== undefined
                        ? ` (${data.confidence}% confidence)`
                        : "";


                return `

                    <div class="item">

                        <span class="label">
                            ${escapeHTML(name)}
                        </span>

                        <span class="value">
                            ${escapeHTML(verdict)}
                            ${escapeHTML(confidence)}
                        </span>

                    </div>

                `;

            }
        ).join("");

    }


    function formatBytes(bytes) {

        if (!bytes) {
            return "Unknown";
        }


        const units =
            ["B", "KB", "MB", "GB"];


        let i = 0;


        while (
            bytes >= 1024 &&
            i < units.length - 1
        ) {

            bytes /= 1024;
            i++;

        }


        return `${bytes.toFixed(2)} ${units[i]}`;

    }


    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    document
        .getElementById("hashInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    analyzeHash();
                }

            }
        );

</script>

</body>
</html>
